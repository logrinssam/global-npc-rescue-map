<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지구촌 NPC 구조대</title>
  <meta name="description" content="세계 지도를 탐험하며 다섯 NPC를 만나고 지구촌 문제의 해결책을 찾아가는 초등 사회 수업용 게임 맵" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230a7891'/%3E%3Cpath d='M16 25c5-8 13-11 22-9l5 7-6 5-3 10-7 6-8-6z' fill='%23f2cc63'/%3E%3Ccircle cx='46' cy='17' r='5' fill='%23ff7a59'/%3E%3C/svg%3E" />
  <style>
    :root {
      --navy: #102a43;
      --ocean: #087f9c;
      --ocean-deep: #075c74;
      --sky: #d9f4f7;
      --island: #f4d06f;
      --land: #78b86b;
      --land-dark: #36734b;
      --coral: #ff7357;
      --paper: #fffdf5;
      --ink-soft: #486581;
      --line: rgba(16, 42, 67, .16);
      --shadow: 0 18px 50px rgba(16, 42, 67, .18);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--navy);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 12%, rgba(255,255,255,.9) 0 4%, transparent 4.3%),
        linear-gradient(180deg, #c7f0f5 0%, #eaf9f5 58%, #fff9e9 100%);
      overflow-x: hidden;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 34px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 50px; height: 50px; display: grid; place-items: center;
      border-radius: 16px; background: var(--navy); color: white;
      box-shadow: 0 8px 0 rgba(16,42,67,.12); font-size: 27px;
      transform: rotate(-3deg);
    }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2.15rem); letter-spacing: -.04em; }
    .eyebrow { margin: 0 0 2px; color: var(--ocean-deep); font-weight: 800; font-size: .83rem; letter-spacing: .08em; }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .pill, .ghost {
      min-height: 42px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,255,255,.82); padding: 9px 14px; font-weight: 800;
    }
    .ghost { cursor: pointer; }
    .ghost:hover { background: white; transform: translateY(-1px); }

    .game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; }
    .map-card, .side-card {
      border: 1px solid rgba(255,255,255,.72); border-radius: 28px;
      background: rgba(255,255,255,.72); box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .map-card { position: relative; padding: 18px; overflow: hidden; min-height: 650px; }

    .mission-strip {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
      position: relative; z-index: 5; margin-bottom: 12px;
    }
    .mission-strip h2 { margin: 0 0 4px; font-size: clamp(1.18rem, 2.3vw, 1.62rem); }
    .mission-strip p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
    .progress-wrap { width: min(240px, 40%); text-align: right; }
    .progress-label { display: block; margin-bottom: 7px; font-weight: 900; font-size: .9rem; }
    .progress-track { height: 12px; overflow: hidden; border-radius: 99px; background: #dbe9eb; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--coral), var(--island)); transition: width .45s ease; }

    .map {
      position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 480px;
      overflow: hidden; border-radius: 23px; isolation: isolate;
      background:
        radial-gradient(circle at 78% 24%, rgba(255,255,255,.25) 0 4%, transparent 4.2%),
        linear-gradient(160deg, #0797b5 0%, var(--ocean) 45%, var(--ocean-deep) 100%);
      border: 6px solid rgba(255,255,255,.7);
      box-shadow: inset 0 0 90px rgba(0,36,55,.2);
    }

    .map::after {
      content: ""; position: absolute; inset: auto -12% -34% -12%; height: 54%; z-index: -1;
      background: repeating-radial-gradient(ellipse at 50% 100%, transparent 0 15px, rgba(255,255,255,.11) 16px 18px);
      animation: tide 10s linear infinite;
    }
    @keyframes tide { to { transform: translateX(34px); } }

    .world { position: absolute; inset: 3% 2% 4%; width: 96%; height: 93%; filter: drop-shadow(0 14px 8px rgba(0,42,54,.2)); }
    .continent { fill: #75bd70; stroke: #eaf7c6; stroke-width: 3; stroke-linejoin: round; }
    .continent-detail { fill: none; stroke: rgba(37,103,66,.35); stroke-width: 2; stroke-dasharray: 6 7; }
    .route { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 4 11; }
    .route-live { fill: none; stroke: var(--island); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 13; stroke-dashoffset: 30; animation: routeMove 2.4s linear infinite; }
    @keyframes routeMove { to { stroke-dashoffset: 0; } }

    .cloud { position: absolute; z-index: 1; color: rgba(255,255,255,.45); font-size: 34px; animation: drift 18s linear infinite; pointer-events: none; }
    .cloud.c1 { top: 15%; left: -8%; animation-delay: -4s; }
    .cloud.c2 { top: 67%; left: -16%; animation-delay: -11s; font-size: 26px; }
    @keyframes drift { to { transform: translateX(calc(100vw + 220px)); } }

    .hotspot {
      position: absolute; z-index: 4; width: 58px; height: 58px; padding: 0;
      border: 4px solid white; border-radius: 50%; display: grid; place-items: center;
      background: var(--coral); box-shadow: 0 8px 0 rgba(16,42,67,.2), 0 0 0 7px rgba(255,255,255,.23);
      cursor: pointer; transform: translate(-50%, -50%); transition: transform .2s, filter .2s;
      font-size: 26px;
    }
    .hotspot:hover, .hotspot:focus-visible { transform: translate(-50%, -56%) scale(1.08); outline: 4px solid var(--island); outline-offset: 4px; }
    .hotspot.locked { filter: grayscale(1) brightness(.8); cursor: not-allowed; background: #8aa2ad; }
    .hotspot.done { background: #1f9d68; }
    .hotspot::after {
      content: attr(data-short); position: absolute; top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%); white-space: nowrap; padding: 5px 9px;
      border-radius: 9px; background: rgba(10,43,59,.88); color: white;
      font-weight: 900; font-size: .75rem; box-shadow: 0 5px 12px rgba(0,0,0,.16);
    }

    .avatar {
      --x: 83%; --y: 63%;
      position: absolute; z-index: 6; left: var(--x); top: var(--y); transform: translate(-50%, -115%);
      width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50% 50% 48% 52%;
      background: var(--island); border: 4px solid white; box-shadow: 0 8px 18px rgba(4,49,65,.35);
      font-size: 24px; transition: left 1.1s cubic-bezier(.2,.8,.2,1), top 1.1s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    .avatar::after { content: ""; position: absolute; bottom: -10px; width: 12px; height: 12px; background: var(--island); transform: rotate(45deg); border-right: 3px solid white; border-bottom: 3px solid white; }
    .avatar.moving { animation: hop .48s ease-in-out infinite alternate; }
    @keyframes hop { to { margin-top: -12px; transform: translate(-50%, -115%) rotate(4deg); } }

    .map-legend {
      position: absolute; left: 16px; bottom: 14px; z-index: 4;
      display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: 12px;
      background: rgba(255,255,255,.86); font-size: .75rem; font-weight: 800;
    }

    .side-card { padding: 18px; align-self: start; }
    .side-card h2 { margin: 0 0 6px; font-size: 1.18rem; }
    .side-card > p { margin: 0 0 16px; color: var(--ink-soft); line-height: 1.55; }
    .passport { display: grid; gap: 9px; }
    .passport-item {
      display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px;
      min-height: 62px; padding: 8px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.66);
    }
    .passport-item .icon { width: 42px; height: 42px; display: grid; place-items: center; background: #e9f6f3; border-radius: 12px; font-size: 22px; }
    .passport-item strong { display: block; font-size: .92rem; }
    .passport-item small { color: var(--ink-soft); }
    .stamp { width: 34px; height: 34px; display: grid; place-items: center; border: 2px dashed #9ab0b8; color: #8ca0a8; border-radius: 50%; font-weight: 1000; transform: rotate(-8deg); }
    .passport-item.done .stamp { border-color: #179966; color: #179966; background: #e8faef; }

    .tip { margin-top: 14px; padding: 12px; border-radius: 14px; background: #fff5ce; line-height: 1.5; font-size: .86rem; }

    dialog {
      width: min(560px, calc(100% - 28px)); border: 0; border-radius: 26px; padding: 0;
      color: var(--navy); background: var(--paper); box-shadow: 0 30px 90px rgba(0,26,42,.4);
    }
    dialog::backdrop { background: rgba(7, 34, 48, .68); backdrop-filter: blur(5px); }
    .modal-head { padding: 20px 22px 15px; background: linear-gradient(135deg, #d9f4f7, #fff3c6); }
    .modal-kicker { margin: 0 0 5px; color: var(--ocean-deep); font-size: .82rem; font-weight: 900; letter-spacing: .08em; }
    .modal-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .modal-title h2 { margin: 0; font-size: 1.48rem; }
    .close { border: 0; background: rgba(255,255,255,.75); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
    .modal-body { padding: 20px 22px 22px; }
    .npc-line { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 17px; }
    .npc-face { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: #e8f5ee; font-size: 34px; }
    .npc-line p { margin: 0; line-height: 1.65; }
    .mission-box { padding: 14px; border: 2px solid #efc95b; border-radius: 16px; background: #fff9dd; line-height: 1.55; }
    .mission-box strong { display: block; margin-bottom: 4px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .primary, .complete {
      min-height: 50px; border-radius: 15px; border: 0; padding: 12px; font-weight: 900; cursor: pointer; text-decoration: none; display: grid; place-items: center; text-align: center;
    }
    .primary { background: var(--navy); color: white; }
    .primary.disabled { background: #9babb2; pointer-events: none; }
    .complete { background: var(--coral); color: white; }
    .complete.done { background: #1f9d68; }
    .link-note { margin: 9px 0 0; text-align: center; color: var(--ink-soft); font-size: .78rem; }

    .celebrate { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; display: none; }
    .celebrate.show { display: block; }
    .confetti { position: absolute; top: -20px; width: 13px; height: 20px; animation: fall 2.5s linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    @media (max-width: 920px) {
      .game-layout { grid-template-columns: 1fr; }
      .side-card { order: 2; }
      .passport { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .map-card { min-height: 0; }
    }
    @media (max-width: 640px) {
      .shell { width: min(100% - 16px, 1180px); padding-top: 10px; }
      .topbar { align-items: flex-start; }
      .brand-mark { width: 44px; height: 44px; border-radius: 13px; }
      .pill { display: none; }
      .map-card { padding: 10px; border-radius: 20px; }
      .mission-strip { display: block; padding: 4px; }
      .progress-wrap { width: 100%; text-align: left; margin-top: 12px; }
      .map { min-height: 520px; aspect-ratio: 4 / 5; }
      .world { transform: scale(1.18); transform-origin: center; }
      .hotspot { width: 50px; height: 50px; font-size: 21px; }
      .hotspot::after { font-size: .68rem; }
      .passport { grid-template-columns: 1fr; }
      .modal-actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🧭</div>
        <div>
          <p class="eyebrow">6학년 사회 · 지구촌 사람들</p>
          <h1>지구촌 NPC 구조대</h1>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="statusPill">첫 탐험을 시작하세요</span>
        <button class="ghost" id="resetButton" type="button">처음부터</button>
      </div>
    </header>

    <main class="game-layout">
      <section class="map-card" aria-labelledby="mapHeading">
        <div class="mission-strip">
          <div>
            <h2 id="mapHeading">탐험 지점을 선택하세요</h2>
            <p>열린 지역을 누르면 탐험가가 이동합니다. NPC와 대화한 뒤 완료 도장을 찍으세요.</p>
          </div>
          <div class="progress-wrap" aria-label="전체 탐험 진행률">
            <span class="progress-label" id="progressLabel">0 / 5 완료</span>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          </div>
        </div>

        <div class="map" id="worldMap">
          <span class="cloud c1" aria-hidden="true">☁</span>
          <span class="cloud c2" aria-hidden="true">☁</span>
          <svg class="world" viewBox="0 0 1000 560" role="img" aria-label="다섯 탐험 지점이 표시된 단순화된 세계 지도">
            <path class="continent" d="M70 115 160 70 245 95 282 145 250 180 216 177 192 226 150 244 119 209 76 190 52 150Z"/>
            <path class="continent" d="M228 267 280 278 315 337 300 428 258 502 221 450 204 354Z"/>
            <path class="continent" d="M405 138 464 101 557 109 591 140 570 174 511 170 480 196 428 184Z"/>
            <path class="continent" d="M459 205 525 194 578 227 596 318 558 421 505 390 474 310Z"/>
            <path class="continent" d="M572 120 704 73 840 99 936 157 907 210 827 216 797 251 731 239 694 204 632 211 583 176Z"/>
            <path class="continent" d="M825 350 889 338 940 377 912 429 846 421 805 384Z"/>
            <path class="continent-detail" d="M143 100 168 160 230 166M250 285 270 350 244 440M489 126 524 160M508 219 549 286 529 370M631 135 706 175 792 151 864 178"/>
            <path class="route" d="M835 353 C760 300 732 250 690 240 C620 224 570 270 522 294 C455 328 430 266 446 228 C470 176 560 120 610 104"/>
            <path class="route-live" d="M835 353 C760 300 732 250 690 240 C620 224 570 270 522 294 C455 328 430 266 446 228 C470 176 560 120 610 104"/>
          </svg>

          <div class="avatar" id="avatar" aria-hidden="true">🧑‍🚀</div>

          <button class="hotspot" style="left:83%;top:65%" data-index="0" data-short="투발루" aria-label="투발루 주민 NPC 탐험">🌊</button>
          <button class="hotspot locked" style="left:45%;top:48%" data-index="1" data-short="말리" aria-label="말리 농부 NPC 탐험">🌾</button>
          <button class="hotspot locked" style="left:70%;top:43%" data-index="2" data-short="미얀마" aria-label="미얀마 청소년 NPC 탐험">🕊️</button>
          <button class="hotspot locked" style="left:68%;top:49%" data-index="3" data-short="방글라데시" aria-label="방글라데시 기후이주 주민 NPC 탐험">🏠</button>
          <button class="hotspot locked" style="left:61%;top:20%" data-index="4" data-short="구호본부" aria-label="국제구호단체 활동가 NPC 탐험">🤝</button>

          <div class="map-legend" aria-hidden="true"><span>🔴 탐험 가능</span><span>⚪ 잠김</span><span>🟢 완료</span></div>
        </div>
      </section>

      <aside class="side-card" aria-labelledby="passportHeading">
        <h2 id="passportHeading">나의 NPC 여권</h2>
        <p>대화를 마친 지역마다 탐험 도장이 생깁니다.</p>
        <div class="passport" id="passport"></div>
        <div class="tip"><strong>탐험 규칙</strong><br>정답을 빨리 찾기보다 NPC의 처지에서 이유를 생각해 보세요.</div>
      </aside>
    </main>
  </div>

  <dialog id="missionDialog" aria-labelledby="dialogTitle">
    <div class="modal-head">
      <p class="modal-kicker" id="dialogKicker"></p>
      <div class="modal-title">
        <h2 id="dialogTitle"></h2>
        <button class="close" id="closeDialog" type="button" aria-label="창 닫기">×</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="npc-line">
        <div class="npc-face" id="dialogIcon" aria-hidden="true"></div>
        <p id="dialogIntro"></p>
      </div>
      <div class="mission-box"><strong>오늘의 미션</strong><span id="dialogMission"></span></div>
      <div class="modal-actions">
        <a class="primary disabled" id="botLink" href="#" target="_blank" rel="noopener">챗봇 링크 준비 중</a>
        <button class="complete" id="completeButton" type="button">대화 완료 · 도장 찍기</button>
      </div>
      <p class="link-note" id="linkNote">선생님이 E-GPT 링크를 연결하면 이 버튼이 열립니다.</p>
    </div>
  </dialog>

  <div class="celebrate" id="celebrate" aria-hidden="true"></div>

  <script>
    // E-GPT 챗봇을 만든 뒤 아래 botUrl 다섯 곳에 학생용 URL을 붙여 넣으세요.
    const missions = [
      {
        place: "투발루", name: "섬 주민 테아", icon: "🌊", coords: [83, 65],
        topic: "기후위기 · 해수면 상승",
        intro: "바닷물이 생활 공간 가까이 들어오면서 집, 식수, 생계와 마을의 미래를 함께 고민하고 있어요.",
        mission: "테아의 입장에서 가장 지키고 싶은 것을 찾고, 주민·정부·국제사회가 함께할 해결책을 제안하세요.",
        botUrl: ""
      },
      {
        place: "말리", name: "농부 아마두", icon: "🌾", coords: [45, 48],
        topic: "가뭄 · 식량 부족 · 빈곤",
        intro: "비가 불규칙해지면서 농작물 수확과 가족의 식량, 소득이 함께 영향을 받고 있어요.",
        mission: "당장 필요한 지원과 오래 지속될 해결책을 나누어 보고, 제한된 자원의 우선순위를 정하세요.",
        botUrl: ""
      },
      {
        place: "미얀마", name: "청소년 민", icon: "🕊️", coords: [70, 43],
        topic: "분쟁 · 평화 · 인권",
        intro: "분쟁 때문에 안전한 일상과 학교 수업이 불안정해진 상황에서 계속 배우고 싶은 청소년이에요.",
        mission: "민의 안전과 학습권을 지키면서 청소년의 의견까지 반영하는 지원 방법을 찾아보세요.",
        botUrl: ""
      },
      {
        place: "방글라데시", name: "주민 리마", icon: "🏠", coords: [68, 49],
        topic: "홍수 · 기후이주",
        intro: "반복되는 홍수와 환경 변화로 현재 지역에 남을지, 새로운 곳으로 이동할지 가족과 고민하고 있어요.",
        mission: "이동할 때 얻는 것과 잃는 것을 비교하고, 남는 사람과 이동하는 사람 모두를 위한 방법을 제안하세요.",
        botUrl: ""
      },
      {
        place: "국제구호본부", name: "활동가 수현", icon: "🤝", coords: [61, 20],
        topic: "해결 주체 · 국제협력",
        intro: "여러 지역의 주민 의견을 듣고 긴급지원과 장기 해결 사이에서 한정된 예산을 배분하는 활동가예요.",
        mission: "10점의 예산을 공정하게 나누고 주민·정부·국제기구·NGO가 맡을 역할을 결정하세요.",
        botUrl: ""
      }
    ];

    const storageKey = "globalNpcRescueProgressV1";
    let completed = new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));
    let selectedIndex = 0;
    const avatar = document.getElementById("avatar");
    const hotspots = [...document.querySelectorAll(".hotspot")];
    const dialog = document.getElementById("missionDialog");
    const passport = document.getElementById("passport");

    function maxUnlocked() {
      for (let i = 0; i < missions.length; i++) if (!completed.has(i)) return i;
      return missions.length - 1;
    }

    function render() {
      const unlocked = maxUnlocked();
      hotspots.forEach((button, i) => {
        button.classList.toggle("done", completed.has(i));
        button.classList.toggle("locked", i > unlocked && !completed.has(i));
        button.setAttribute("aria-disabled", String(i > unlocked && !completed.has(i)));
      });
      passport.innerHTML = missions.map((m, i) => `
        <div class="passport-item ${completed.has(i) ? "done" : ""}">
          <div class="icon">${m.icon}</div>
          <div><strong>${m.place}</strong><small>${completed.has(i) ? "탐험 완료" : i <= unlocked ? "탐험 가능" : "아직 잠김"}</small></div>
          <div class="stamp">${completed.has(i) ? "완료" : "?"}</div>
        </div>`).join("");
      const count = completed.size;
      document.getElementById("progressLabel").textContent = `${count} / 5 완료`;
      document.getElementById("progressBar").style.width = `${count * 20}%`;
      document.getElementById("statusPill").textContent = count === 5 ? "모든 탐험 완료!" : count ? `${5-count}개 지역이 남았어요` : "첫 탐험을 시작하세요";
    }

    function moveAvatar(index) {
      const [x, y] = missions[index].coords;
      avatar.classList.add("moving");
      avatar.style.setProperty("--x", `${x}%`);
      avatar.style.setProperty("--y", `${y}%`);
      window.setTimeout(() => avatar.classList.remove("moving"), 1150);
    }

    function openMission(index) {
      const unlocked = maxUnlocked();
      if (index > unlocked && !completed.has(index)) {
        hotspots[index].animate([{transform:"translate(-50%,-50%) rotate(-4deg)"},{transform:"translate(-50%,-50%) rotate(4deg)"},{transform:"translate(-50%,-50%)"}], {duration:360});
        return;
      }
      selectedIndex = index;
      moveAvatar(index);
      const m = missions[index];
      window.setTimeout(() => {
        document.getElementById("dialogKicker").textContent = `${index + 1}번째 탐험 · ${m.topic}`;
        document.getElementById("dialogTitle").textContent = `${m.name} 만나기`;
        document.getElementById("dialogIcon").textContent = m.icon;
        document.getElementById("dialogIntro").textContent = m.intro;
        document.getElementById("dialogMission").textContent = m.mission;
        const link = document.getElementById("botLink");
        const note = document.getElementById("linkNote");
        if (m.botUrl) {
          link.href = m.botUrl; link.textContent = "E-GPT 대화 시작"; link.classList.remove("disabled");
          note.textContent = "대화를 마치고 돌아와 완료 도장을 찍으세요.";
        } else {
          link.href = "#"; link.textContent = "챗봇 링크 준비 중"; link.classList.add("disabled");
          note.textContent = "선생님이 E-GPT 링크를 연결하면 이 버튼이 열립니다.";
        }
        const complete = document.getElementById("completeButton");
        complete.textContent = completed.has(index) ? "완료됨 · 다시 확인" : "대화 완료 · 도장 찍기";
        complete.classList.toggle("done", completed.has(index));
        dialog.showModal();
      }, 700);
    }

    function celebrate() {
      const layer = document.getElementById("celebrate");
      layer.innerHTML = Array.from({length: 42}, (_, i) => `<i class="confetti" style="left:${(i*23)%100}%;background:${["#ff7357","#f4d06f","#47b39c","#6d8ed6"][i%4]};animation-delay:${(i%8)*.08}s"></i>`).join("");
      layer.classList.add("show");
      window.setTimeout(() => layer.classList.remove("show"), 2900);
    }

    hotspots.forEach((button, i) => button.addEventListener("click", () => openMission(i)));
    document.getElementById("closeDialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
    document.getElementById("completeButton").addEventListener("click", () => {
      if (!completed.has(selectedIndex)) {
        completed.add(selectedIndex);
        localStorage.setItem(storageKey, JSON.stringify([...completed]));
        render();
        if (completed.size === 5) celebrate();
      }
      dialog.close();
      const next = Math.min(maxUnlocked(), missions.length - 1);
      window.setTimeout(() => moveAvatar(next), 220);
    });
    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("탐험 도장을 모두 지우고 처음부터 시작할까요?")) return;
      completed.clear(); localStorage.removeItem(storageKey); render(); moveAvatar(0);
    });

    render();
    moveAvatar(Math.min(maxUnlocked(), missions.length - 1));
  </script>
</body>
</html>
