<style>

.map-node{position:absolute;translate:-50% -50%;z-index:5}.node-button{border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}.node-core{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);border:5px solid var(--ink2);box-shadow:0 0 0 1px rgba(244,236,217,.52),0 8px 22px rgba(0,0,0,.34);transition:.25s;position:relative}.node-core svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.node-label{position:absolute;top:55px;left:50%;translate:-50% 0;white-space:nowrap;background:rgba(4,21,26,.88);border:1px solid rgba(244,236,217,.16);border-radius:7px;padding:6px 9px 7px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:.2s}.node-label strong{display:block;font:700 12px Georgia,"Noto Serif KR",serif}.node-label span{display:block;margin-top:2px;color:var(--muted);font-size:9px;letter-spacing:.08em}.node-button:hover .node-core,.node-button:focus-visible .node-core{transform:translateY(-4px) scale(1.08)}.node-button:focus-visible{outline:2px solid var(--gold);outline-offset:7px;border-radius:50%}.map-node.current .node-core{background:var(--gold)}.map-node.current .node-core:before{content:"";position:absolute;inset:-11px;border:2px solid rgba(255,201,95,.62);border-radius:50%;box-shadow:0 0 18px rgba(255,201,95,.18)}.map-node.done .node-core{background:var(--mint)}.map-node.done .node-label span{color:var(--mint)}.map-node.locked .node-core{background:#263e42;color:#769093;filter:saturate(.3)}.map-node.locked .node-label{opacity:.55}.map-node.locked .node-button{cursor:not-allowed}.map-node.shake{animation:shake .35s ease}@keyframes shake{25%{translate:calc(-50% - 5px) -50%}75%{translate:calc(-50% + 5px) -50%}}

dialog{width:min(610px,calc(100% - 30px));border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:0;color:var(--white);background:#0c2830;box-shadow:0 22px 70px rgba(0,0,0,.34)}dialog::backdrop{background:rgba(2,13,16,.76);backdrop-filter:blur(8px)}.dialog-inner{padding:28px}.dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.dialog-head small{color:var(--gold);font-size:10px;letter-spacing:.17em;font-weight:800}.dialog-head h2{margin:8px 0 0;font:600 28px/1.2 Georgia,"Noto Serif KR",serif}.close{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted)}.dialog-copy{margin:21px 0 0;padding:18px;background:rgba(0,0,0,.13);border-left:2px solid var(--mint);color:#cfdbd7;font-size:14px;line-height:1.7}.dialog-mission{margin:18px 0 0;color:var(--paper);font-size:14px;line-height:1.7}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.dialog-actions button,.dialog-actions a{border-radius:3px;padding:13px;text-align:center;text-decoration:none;font-weight:800;font-size:12px;cursor:pointer}.talk{background:var(--paper);color:var(--ink);border:0}.complete{background:transparent;color:var(--mint);border:1px solid rgba(112,224,189,.42)}.complete:hover{background:rgba(112,224,189,.12)}.credits{margin-top:16px;color:#6f8d90;font-size:10px;text-align:center}.celebrate{position:fixed;inset:0;z-index:99;pointer-events:none;display:none;place-items:center}.celebrate.show{display:grid}.reward{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ffe7a4 0 25%,#ffc95f 26% 43%,transparent 44%);display:grid;place-items:center;color:var(--ink);font:800 12px/1.3 Georgia,serif;text-align:center;filter:drop-shadow(0 0 36px rgba(255,201,95,.5));animation:reward .95s ease both}@keyframes reward{0%{transform:scale(.2) rotate(-50deg);opacity:0}55%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1);opacity:0}}
@media(max-width:900px){.topbar{height:68px}.brand-title{font-size:15px}.hud-label{display:none}.reset{display:none}main{display:block}.map-stage{min-height:64svh}.map-kicker h1{font-size:27px}.map-kicker p{display:none}.world-map{transform:scale(1.2);transform-origin:center 58%}.quest-panel{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:25px 22px}.panel-title{font-size:26px}.panel-actions{margin-top:22px}.legend{bottom:18px}.node-label{display:none}.node-core{width:40px;height:40px}}@media(max-width:520px){.topbar{padding:0 16px}.brand-eyebrow{display:none}.fragment{width:13px;height:13px}.map-stage{min-height:58svh}.map-kicker{top:20px;left:18px}.world-map{transform:scale(1.52);transform-origin:56% 59%}.node-core{width:35px;height:35px;border-width:4px}.node-core svg{width:17px;height:17px}.legend{left:18px;gap:10px;font-size:9px}.dialog-inner{padding:22px 18px}.dialog-actions{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
// E-GPT 챗봇을 만든 뒤 아래 botUrl 다섯 곳에 학생용 링크를 붙여 넣으세요.
const missions=[
{place:"투발루",name:"테아",role:"섬마을 주민",initials:"T",icon:"wave",x:86,y:65,topic:"기후위기 · 해수면 상승",title:"사라지는 마을의 기억",intro:"바닷물이 생활 공간 가까이 들어오면서 집, 식수, 생계와 마을의 미래를 함께 고민하고 있어요.",mission:"테아가 가장 지키고 싶은 것을 찾아보고, 주민·정부·국제사회가 함께할 해결책을 제안하세요.",botUrl:""},
{place:"말리",name:"아마두",role:"농부",initials:"A",icon:"sun",x:45,y:48,topic:"가뭄 · 식량 · 빈곤",title:"메마른 들판의 선택",intro:"비가 불규칙해지면서 농작물 수확과 가족의 식량, 소득이 함께 영향을 받고 있어요.",mission:"당장 필요한 지원과 오래 지속될 해결책을 나누고, 제한된 자원의 우선순위를 정하세요.",botUrl:""},
{place:"미얀마",name:"민",role:"청소년",initials:"M",icon:"bird",x:72,y:43,topic:"분쟁 · 평화 · 인권",title:"멈춰 버린 교실",intro:"분쟁 때문에 안전한 일상과 학교 수업이 불안정한 상황에서도 계속 배우고 싶은 청소년이에요.",mission:"민의 안전과 학습권을 지키면서 청소년의 의견까지 반영하는 지원 방법을 찾아보세요.",botUrl:""},
{place:"방글라데시",name:"리마",role:"지역 주민",initials:"R",icon:"home",x:68,y:51,topic:"홍수 · 기후이주",title:"떠날까, 남을까",intro:"반복되는 홍수와 환경 변화로 지금 사는 곳에 남을지, 새로운 곳으로 이동할지 가족과 고민하고 있어요.",mission:"이동할 때 얻는 것과 잃는 것을 비교하고, 남는 사람과 이동하는 사람 모두를 위한 방법을 제안하세요.",botUrl:""},
{place:"국제구호본부",name:"수현",role:"구호 활동가",initials:"S",icon:"compass",x:58,y:24,topic:"국제협력 · 공정한 배분",title:"마지막 10점의 예산",intro:"여러 지역 주민의 목소리를 듣고 긴급지원과 장기 해결 사이에서 한정된 예산을 배분하는 활동가예요.",mission:"10점의 예산을 공정하게 나누고 주민·정부·국제기구·NGO가 맡을 역할을 결정하세요.",botUrl:""}];
const icons={wave:'<svg viewBox="0 0 24 24"><path d="M3 15c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5 0M4 10c1.7-1.6 3.5-1.6 5.2 0s3.5 1.6 5.2 0 3.5-1.6 5.2 0"/></svg>',sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2.1 2.1M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',bird:'<svg viewBox="0 0 24 24"><path d="M3 15c3-4 6-5 9-2 2-4 5-5 9-3-3 1-5 4-6 7-4-2-8-2-12-2z"/></svg>',home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM9 20v-6h6v6"/></svg>',compass:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>'};
const storageKey="globalNpcRescueProgressV2";let completed=new Set(JSON.parse(localStorage.getItem(storageKey)||"[]"));let selected=Math.min(nextUnlocked(),missions.length-1);const $=id=>document.getElementById(id);
function nextUnlocked(){for(let i=0;i<missions.length;i++)if(!completed.has(i))return i;return missions.length}function stateOf(i){const n=nextUnlocked();return completed.has(i)?"done":i===n?"current":i>n?"locked":"open"}function routePoint(m){return[m.x*10,m.y*6.5]}
function renderRoutes(){const layer=$("routeLayer");layer.innerHTML="";for(let i=0;i<missions.length-1;i++){const[x1,y1]=routePoint(missions[i]),[x2,y2]=routePoint(missions[i+1]),p=document.createElementNS("http://www.w3.org/2000/svg","path"),cx=(x1+x2)/2,bend=i%2?35:-35;p.setAttribute("d",`M${x1} ${y1} Q${cx} ${(y1+y2)/2+bend} ${x2} ${y2}`);p.setAttribute("class",`route ${completed.has(i)?"reached":""}`);layer.appendChild(p)}}
function renderNodes(){$("nodes").innerHTML=missions.map((m,i)=>{const state=stateOf(i),status=state==="done"?"탐험 완료":state==="current"?"신호 수신 중":state==="locked"?"아직 잠김":"탐험 가능";return`<div class="map-node ${state}" data-index="${i}" style="left:${m.x}%;top:${m.y}%"><button class="node-button" type="button" aria-label="${m.place} ${status}" ${state==="locked"?'aria-disabled="true"':''}><span class="node-core">${icons[m.icon]}</span><span class="node-label"><strong>${m.place}</strong><span>${status}</span></span></button></div>`}).join("");document.querySelectorAll(".node-button").forEach(btn=>btn.addEventListener("click",()=>selectNode(Number(btn.parentElement.dataset.index))))}
function renderPanel(){const m=missions[selected],state=stateOf(selected);$("panelIndex").textContent=`${state==="done"?"ARCHIVED QUEST":"ACTIVE QUEST"} · ${String(selected+1).padStart(2,"0")}`;$("panelPlace").textContent=`${m.place} / ${m.topic}`;$("panelTitle").textContent=m.title;$("portrait").textContent=m.initials;$("npcName").textContent=m.name;$("npcRole").textContent=m.role;$("brief").textContent=m.intro;$("objective").textContent=m.mission;$("enterBtn").disabled=state==="locked";$("enterBtn").firstElementChild.textContent=state==="done"?"기록 다시 보기":"임무 살펴보기"}
function renderHud(){$("fragments").innerHTML=missions.map((_,i)=>`<i class="fragment ${completed.has(i)?"on":""}"></i>`).join("")}function render(){renderRoutes();renderNodes();renderPanel();renderHud()}
function selectNode(i){const node=document.querySelector(`.map-node[data-index="${i}"]`);if(stateOf(i)==="locked"){node.classList.remove("shake");void node.offsetWidth;node.classList.add("shake");showToast("앞선 지역의 목소리를 먼저 들어주세요.");return}selected=i;renderPanel()}
function openMission(){const m=missions[selected];if(stateOf(selected)==="locked")return;$("dialogTopic").textContent=m.topic;$("dialogTitle").textContent=`${m.name}의 이야기`;$("dialogIntro").textContent=m.intro;$("dialogMission").textContent=m.mission;const talk=$("talkBtn");talk.href=m.botUrl||"https://egpt.kr/";talk.target="_blank";talk.rel="noopener";talk.textContent=m.botUrl?"NPC와 대화 시작":"E-GPT에서 챗봇 연결하기";$("completeBtn").textContent=completed.has(selected)?"이미 받은 세계 조각":"대화 후 세계 조각 받기";$("completeBtn").disabled=completed.has(selected);$("missionDialog").showModal()}
function completeMission(){if(completed.has(selected))return;completed.add(selected);localStorage.setItem(storageKey,JSON.stringify([...completed]));$("missionDialog").close();$("celebrate").classList.add("show");setTimeout(()=>$("celebrate").classList.remove("show"),950);setTimeout(()=>{selected=Math.min(nextUnlocked(),missions.length-1);render();showToast(completed.size===missions.length?"모든 목소리를 모았습니다.":"새로운 신호가 지도에 나타났습니다.")},480)}let toastTimer;function showToast(message){clearTimeout(toastTimer);$("toast").textContent=message;$("toast").classList.add("show");toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2200)}
$("enterBtn").addEventListener("click",openMission);$("closeDialog").addEventListener("click",()=>$("missionDialog").close());$("missionDialog").addEventListener("click",e=>{if(e.target===$("missionDialog"))$("missionDialog").close()});$("completeBtn").addEventListener("click",completeMission);$("resetBtn").addEventListener("click",()=>{if(confirm("모든 탐험 기록을 초기화할까요?")){completed.clear();localStorage.removeItem(storageKey);selected=0;render()}});render();
</script></body></html>
